[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3"
# Target-scoped rather than under [build]: host/ builds PC binaries from this
# same tree, and a host executable linked without start files segfaults on
# entry.
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

[env]

[build]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core", "alloc"]
