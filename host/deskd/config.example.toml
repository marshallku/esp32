# deskd profile — copy to ~/.config/deskd/config.toml, then `deskd check`.
#
# Up to 8 pages of up to 9 keys (3x3, row-major from the top left). Screens
# swipe in the order dashboard, stats, notifications, page 0, page 1, ...
# Labels may be Korean (drawn with Unifont; two lines of eight syllables at
# most). Colours are "#rrggbb".
#
# `icon = "mic"` draws a built-in icon above the label, in the text colour;
# `icon_on` replaces it while the key's state is true. The names are Lucide's
# (https://lucide.dev), limited to the set in tools/icons/icons.txt.
#
# Actions:
#   { type = "shell", cmd = "..." }                 sh -c, detached
#   { type = "keys", mods = "CTRL SHIFT", key = "T" }  shortcut to the focused window (Hyprland)
#   { type = "keys", mods = "CTRL SHIFT", key = "M", window = "class:^(discord)$" }
#                                                   ...or to that window, leaving focus where it is
#   { type = "media", cmd = "play-pause" }          playerctl: play-pause | next | previous | stop
#   { type = "volume", step = 5 }                   default output, percent (negative lowers)
#   { type = "mute" }                               toggle default output mute
#   { type = "mic-mute" }                           toggle default input mute
#   { type = "page", index = 1 }                    switch to another page
#   { type = "dashboard" }                          switch to the dashboard
#   { type = "stats" }                              switch to the PC stats screen
#   { type = "notes" }                              switch to the notifications
#   { type = "obs-scene", scene = "Desk" }          OBS: switch program scene
#   { type = "obs-record" }                         OBS: start/stop recording
#   { type = "obs-stream" }                         OBS: start/stop streaming
#   { type = "obs-mute", input = "Mic/Aux" }        OBS: toggle an input's mute
#
# Live states a key can show with `state = "..."` (drawn inverted while true,
# with label_on / sub_on if given):
#   "mic-muted", "muted"                            PipeWire default input / output
#   "obs-connected", "obs-recording", "obs-streaming"
#   "obs-scene:<scene>"                             true while it is the program scene
#   "obs-muted:<input>"
#   any name defined in a [state.<name>] table (see the end of this file)
#
# OBS is only contacted when some key uses it. The obs-websocket password is
# read from $OBS_WEBSOCKET_PASSWORD, or else from OBS's own config, so it
# normally needs no setup. Override the address with:
#   [obs]
#   url = "ws://127.0.0.1:4455"

[[page]]
name = "main"

[[page.key]]
label = "Mic"
icon = "mic"
icon_on = "mic-off"
sub = "live"
sub_on = "MUTED"
color = "#2d5a3d"
state = "mic-muted"
action = { type = "mic-mute" }

[[page.key]]
label = "Vol -"
icon = "volume-1"
color = "#2a3f5f"
action = { type = "volume", step = -5 }

[[page.key]]
label = "Vol +"
icon = "volume-2"
color = "#2a3f5f"
action = { type = "volume", step = 5 }

[[page.key]]
label = "Prev"
icon = "skip-back"
color = "#4a3a5e"
action = { type = "media", cmd = "previous" }

[[page.key]]
label = "Play"
icon = "play"
sub = "pause"
color = "#4a3a5e"
action = { type = "media", cmd = "play-pause" }

[[page.key]]
label = "Next"
icon = "skip-forward"
color = "#4a3a5e"
action = { type = "media", cmd = "next" }

[[page.key]]
label = "Terminal"
icon = "terminal"
color = "#333333"
action = { type = "shell", cmd = "kitty" }

[[page.key]]
label = "Screenshot"
icon = "scan"
sub = "region"
color = "#333333"
action = { type = "shell", cmd = "grim -g \"$(slurp)\" - | wl-copy" }

[[page.key]]
label = "OBS"
icon = "video"
color = "#5e4a2a"
action = { type = "page", index = 1 }

[[page]]
name = "obs"

[[page.key]]
label = "Scene"
icon = "clapperboard"
color = "#2a3f5f"
state = "obs-scene:Scene"
action = { type = "obs-scene", scene = "Scene" }

[[page.key]]
label = "Scene 2"
icon = "clapperboard"
color = "#2a3f5f"
state = "obs-scene:Scene 2"
action = { type = "obs-scene", scene = "Scene 2" }

[[page.key]]
label = "OBS Mic"
icon = "mic"
icon_on = "mic-off"
sub = "live"
sub_on = "MUTED"
color = "#2d5a3d"
state = "obs-muted:Mic/Aux"
action = { type = "obs-mute", input = "Mic/Aux" }

[[page.key]]
label = "REC"
icon = "circle"
sub = "start"
sub_on = "recording"
color = "#6a2a2a"
state = "obs-recording"
action = { type = "obs-record" }

[[page.key]]
label = "LIVE"
icon = "radio"
sub = "start"
sub_on = "streaming"
color = "#6a2a2a"
state = "obs-streaming"
action = { type = "obs-stream" }

[[page.key]]
label = "OBS"
icon = "video"
sub = "offline"
sub_on = "connected"
color = "#333333"
state = "obs-connected"
action = { type = "shell", cmd = "obs" }

[[page.key]]
label = "Back"
icon = "arrow-left"
color = "#5e4a2a"
action = { type = "page", index = 0 }

[[page.key]]
label = "More"
icon = "arrow-right"
color = "#5e4a2a"
action = { type = "page", index = 2 }

[[page]]
name = "more"

[[page.key]]
label = "Speaker"
icon = "volume-2"
icon_on = "volume-x"
sub = "on"
sub_on = "MUTED"
color = "#2d5a3d"
state = "muted"
action = { type = "mute" }

[[page.key]]
label = "Back"
icon = "arrow-left"
color = "#5e4a2a"
action = { type = "page", index = 1 }

[[page.key]]
label = "Home"
icon = "layout-dashboard"
sub = "dashboard"
color = "#5e4a2a"
action = { type = "dashboard" }

[[page.key]]
label = "Sunshine"
icon = "cast"
sub = "off"
sub_on = "running"
color = "#2a3f5f"
state = "sunshine"
action = { type = "shell", cmd = "systemctl --user is-active --quiet sunshine && systemctl --user stop sunshine || systemctl --user start sunshine" }

# Per-app profiles: while a window of one of `class` has focus (Hyprland's
# `class`, see `hyprctl activewindow`), these pages replace the ones above.
# The first [[app]] that lists the class wins; `page` actions count within
# the profile's own pages.
[[app]]
name = "Firefox"
class = ["firefox"]

[[app.page]]
name = "browse"

[[app.page.key]]
label = "Back"
icon = "arrow-left"
color = "#2a3f5f"
action = { type = "keys", mods = "ALT", key = "Left" }

[[app.page.key]]
label = "Forward"
icon = "arrow-right"
color = "#2a3f5f"
action = { type = "keys", mods = "ALT", key = "Right" }

[[app.page.key]]
label = "New tab"
icon = "plus"
color = "#333333"
action = { type = "keys", mods = "CTRL", key = "T" }

[[app.page.key]]
label = "Close tab"
icon = "x"
color = "#6a2a2a"
action = { type = "keys", mods = "CTRL", key = "W" }

[[app.page.key]]
label = "Reopen"
icon = "rotate-ccw"
sub = "closed tab"
color = "#333333"
action = { type = "keys", mods = "CTRL SHIFT", key = "T" }

[[app.page.key]]
label = "Home"
icon = "layout-dashboard"
sub = "dashboard"
color = "#5e4a2a"
action = { type = "dashboard" }

[[app]]
name = "Discord"
class = ["discord", "vesktop"]

[[app.page]]
name = "voice"

[[app.page.key]]
label = "Mute"
icon = "mic-off"
color = "#2d5a3d"
action = { type = "keys", mods = "CTRL SHIFT", key = "M" }

[[app.page.key]]
label = "Deafen"
icon = "headphone-off"
color = "#2d5a3d"
action = { type = "keys", mods = "CTRL SHIFT", key = "D" }

[[app.page.key]]
label = "Find"
icon = "search"
sub = "quick switch"
color = "#333333"
action = { type = "keys", mods = "CTRL", key = "K" }

[[app.page.key]]
label = "Prev"
icon = "arrow-up"
sub = "channel"
color = "#2a3f5f"
action = { type = "keys", mods = "ALT", key = "Up" }

[[app.page.key]]
label = "Next"
icon = "arrow-down"
sub = "channel"
color = "#2a3f5f"
action = { type = "keys", mods = "ALT", key = "Down" }

[[app.page.key]]
label = "Unread"
icon = "bell"
sub = "next"
color = "#4a3a5e"
action = { type = "keys", mods = "ALT SHIFT", key = "Down" }

[[app.page.key]]
label = "Mark read"
icon = "check"
color = "#4a3a5e"
action = { type = "keys", key = "Escape" }

[[app.page.key]]
label = "Upload"
icon = "upload"
color = "#333333"
action = { type = "keys", mods = "CTRL SHIFT", key = "U" }

[[app.page.key]]
label = "Home"
icon = "layout-dashboard"
sub = "dashboard"
color = "#5e4a2a"
action = { type = "dashboard" }

# A state read from a command: true while `cmd` (run with sh -c) exits 0,
# polled every `every` seconds (default 5), and every second for a few
# seconds after any key that runs something, so a key that toggles it
# shows the result right away. A command that fails to start or runs
# past 10 s leaves its keys as they were.
[state.sunshine]
cmd = "systemctl --user is-active --quiet sunshine"
every = 10
