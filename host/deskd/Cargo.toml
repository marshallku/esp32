[package]
edition = "2024"
name    = "deskd"
version = "0.1.0"

[dependencies]
desk-core = { path = "../desk-core" }

anyhow     = "1.0"
base64     = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nix        = { version = "0.29", features = ["term", "fs", "signal"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2       = "0.10"
tokio      = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = "0.24"
toml       = "0.9"
zbus       = { version = "5", default-features = false, features = ["tokio"] }
