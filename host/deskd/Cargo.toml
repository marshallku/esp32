[package]
edition = "2024"
name    = "deskd"
version = "0.1.0"

[dependencies]
desk-core = { path = "../desk-core" }

anyhow     = "1.0"
nix        = { version = "0.29", features = ["term", "fs"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio      = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util", "signal"] }
toml       = "0.9"
