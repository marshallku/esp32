[package]
edition      = "2024"
name         = "desk-panel"
rust-version = "1.88"
version      = "0.1.0"

# Bring-up diagnostic: drives the RGB panel only, so a blank or garbled screen
# can be blamed on PSRAM, the ST7701 init or the DPI timing before there is an
# application to suspect as well.
[[bin]]
name = "panel-test"
path = "./src/bin/panel_test.rs"


[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
# The board's only USB port goes through a CH340 to UART0, not the S3's
# USB-Serial-JTAG, so the console has to be on the UART.
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "log-04", "uart"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-alloc = "0.10.0"

embedded-graphics = "0.8.1"
embedded-hal      = "1.0.0"
