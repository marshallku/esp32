[package]
edition      = "2024"
name         = "homelab-display"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "homelab-display"
path = "./src/bin/main.rs"

# Bring-up diagnostic: drives the panel only, so a blank screen can be blamed
# on SPI/init or on the application, but not on both at once.
[[bin]]
name = "panel-test"
path = "./src/bin/panel_test.rs"


[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }

critical-section = "1.2.0"
log = "0.4"

embedded-graphics = "0.8.1"
embedded-hal      = "1.0.0"
heapless          = { version = "0.8.0", features = ["serde"] }
serde             = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core   = "0.6.0"

# WiFi + async networking stack, same shape as scd41-monitor.
embassy-executor = "0.10.0"
embassy-time     = "0.5.0"
embassy-net      = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }
esp-alloc        = "0.10.0"
esp-rtos         = { version = "0.3.0", features = ["esp32s3", "esp-radio", "embassy", "log-04"] }
esp-radio        = { version = "0.18.0", features = ["esp32s3", "log-04", "wifi"] }
reqwless         = { version = "0.14.0", default-features = false }
static_cell      = "2.1.0"
