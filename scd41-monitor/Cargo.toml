[package]
edition      = "2024"
name         = "scd41-monitor"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "scd41-monitor"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }

critical-section = "1.2.0"
log = "0.4"

scd4x = "0.5.0"

ssd1306             = "0.10.0"
embedded-graphics   = "0.8.1"
heapless            = "0.8.0"

# WiFi + async networking stack (Phase 1: connect; Phase 2: InfluxDB POST)
embassy-executor = "0.10.0"
embassy-time     = "0.5.0"
embassy-net      = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }
esp-alloc        = "0.10.0"
esp-rtos         = { version = "0.3.0", features = ["esp32s3", "esp-radio", "embassy", "log-04"] }
esp-radio        = { version = "0.18.0", features = ["esp32s3", "log-04", "wifi"] }
reqwless         = { version = "0.14.0", default-features = false }
static_cell      = "2.1.0"
